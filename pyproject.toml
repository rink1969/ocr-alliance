[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-alliance"
version = "0.1.0"
description = "Cross-platform desktop app for multi-model OCR with LLM unification"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "OCR Alliance Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pywebview>=4.4",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pillow>=10.2",
    "aiofiles>=23.2",
    "openai>=1.12",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.21.0",
    "modelscope>=1.18.0",
    "rapidocr>=3.0.0",
    "opencv-python>=4.8",
    "onnxruntime",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]
packaging = [
    "pyinstaller>=6.0",
]

[tool.ruff]
line-length = 120
