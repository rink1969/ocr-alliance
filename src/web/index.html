<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR Alliance</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header class="toolbar">
            <h1>OCR Alliance</h1>
            <div class="toolbar-actions">
                <button id="btn-scan">扫描目录</button>
                <button id="btn-start">开始处理</button>
                <button id="btn-stop" disabled>停止</button>
                <button id="btn-settings">设置</button>
            </div>
        </header>

        <div class="main-layout">
            <aside class="sidebar">
                <div class="panel-header">
                    <span>输入目录</span>
                    <span id="dir-count" class="badge">0</span>
                </div>
                <div id="tree" class="tree"></div>
                <div id="progress" class="progress-area">
                    <div class="progress-text">等待开始...</div>
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                </div>
            </aside>

            <main class="content">
                <div class="content-top">
                    <div class="image-pane">
                        <div class="pane-title">原始图片</div>
                        <div id="image-preview" class="image-preview">
                            <div class="placeholder">点击左侧文件查看</div>
                        </div>
                    </div>
                </div>

                <div class="content-bottom">
                    <div class="result-card">
                        <div class="pane-title">PaddleOCR-VL-1.6</div>
                        <pre id="result-paddleocr" class="result-text">-</pre>
                    </div>
                    <div class="result-card">
                        <div class="pane-title">HunyuanOCR</div>
                        <pre id="result-hunyuan" class="result-text">-</pre>
                    </div>
                    <div class="result-card">
                        <div class="pane-title">GLM-OCR</div>
                        <pre id="result-glm" class="result-text">-</pre>
                    </div>
                    <div class="result-card unified">
                        <div class="pane-title">LLM 统合结果</div>
                        <pre id="result-unified" class="result-text">-</pre>
                    </div>
                </div>
            </main>
        </div>

        <footer class="status-bar">
            <span id="status-text">就绪</span>
            <span id="platform-info"></span>
        </footer>
    </div>

    <div id="setup-modal" class="setup-modal" style="display: none;">
        <div class="setup-panel">
            <h2>首次启动：下载 OCR 模型</h2>
            <p class="setup-description">
                应用需要从魔搭社区下载三个 OCR 模型。模型文件较大，请保持网络畅通。
                如果已经下载过，会自动跳过。
            </p>
            <div id="setup-model-list" class="model-list"></div>
            <div class="setup-actions">
                <button id="btn-skip-download">跳过</button>
                <button id="btn-start-download" class="primary">开始下载</button>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="setup-modal" style="display: none;">
        <div class="setup-panel">
            <h2>设置</h2>
            <p class="setup-description">配置用于统合 OCR 结果的大模型。</p>
            <div class="form-group">
                <label for="settings-base-url">Base URL</label>
                <input type="text" id="settings-base-url" placeholder="https://api.openai.com/v1">
            </div>
            <div class="form-group">
                <label for="settings-model">Model</label>
                <input type="text" id="settings-model" placeholder="gpt-4o">
            </div>
            <div class="form-group">
                <label for="settings-api-key">API Key</label>
                <input type="password" id="settings-api-key" placeholder="留空保持不变">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="settings-temperature">Temperature</label>
                    <input type="number" id="settings-temperature" step="0.1" min="0" max="2">
                </div>
                <div class="form-group">
                    <label for="settings-max-tokens">Max Tokens</label>
                    <input type="number" id="settings-max-tokens" step="1" min="1">
                </div>
            </div>
            <div id="settings-message" class="settings-message"></div>
            <div class="setup-actions">
                <button id="btn-test-llm">测试连接</button>
                <button id="btn-save-settings" class="primary">保存</button>
                <button id="btn-cancel-settings">取消</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
