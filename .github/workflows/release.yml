name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag name (e.g. v0.1.0-main)'
        required: true
        default: 'v0.0.0-manual'
      prerelease:
        description: 'Mark as prerelease'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            arch: x64
            package_ext: tar.gz
          - os: windows-latest
            target: windows-x86_64
            arch: x64
            package_ext: zip
          - os: macos-latest
            target: macos-arm64
            arch: arm64
            package_ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: |
          pip install -e ".[packaging]"

      - name: Build binary
        run: python scripts/build.py

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p release
          tar czf "release/ocr-alliance-${{ matrix.target }}.${{ matrix.package_ext }}" -C dist OCRAlliance

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Compress-Archive -Path dist\OCRAlliance -DestinationPath "release\ocr-alliance-${{ matrix.target }}.${{ matrix.package_ext }}"

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p release
          cd dist && zip -r "../release/ocr-alliance-${{ matrix.target }}.${{ matrix.package_ext }}" OCRAlliance.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocr-alliance-${{ matrix.target }}
          path: release/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ocr-alliance-*

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: artifacts/**/*
          generate_release_notes: true
